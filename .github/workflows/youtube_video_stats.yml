name: YouTube Video Daily Stats

on:
  schedule:
    # JST 00:05
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-video-stats
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Environment
        run: |
          echo "=== Environment ==="
          python --version
          pip --version
          pwd
          ls -la

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Directories
        run: |
          mkdir -p data
          mkdir -p logs

      - name: Run Monitoring
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/collect_video_stats.py

      - name: Verify Output Files
        run: |
          echo "=== DATA ==="
          ls -lah data || true

          echo "=== LOGS ==="
          ls -lah logs || true

          echo "=== CSV HEAD ==="
          head -20 data/video_daily_stats.csv || true

          echo "=== LOG TAIL ==="
          tail -50 logs/monitor.log || true

      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-daily-stats
          path: data/video_daily_stats.csv
          retention-days: 30

      - name: Upload Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-logs
          path: logs/monitor.log
          retention-days: 30

      - name: Commit Updated Files
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/video_daily_stats.csv
          git add logs/monitor.log

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "daily monitoring update"
            git push
          fi
